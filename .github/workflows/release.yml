name: 自动升级版本编译并发布 Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "可选：手动指定目标版本号（例如 0.2.0），留空则按提交自动升级"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: 升级版本、编译双应用并发布 Release
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: macos-26

    steps:
      - name: 检出仓库完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算目标版本号与生成中文更新日志
        id: plan
        run: |
          ARGS=(--repo "${{ github.repository }}" --notes-file release-notes.md --github-output "$GITHUB_OUTPUT")
          if [[ -n "${{ inputs.version }}" ]]; then
            ARGS+=(--override-version "${{ inputs.version }}")
          fi
          python3 scripts/release.py plan "${ARGS[@]}"

      - name: 更新 project.yml 版本号与构建号
        if: steps.plan.outputs.should_release == 'true'
        run: |
          python3 scripts/release.py bump \
            --version "${{ steps.plan.outputs.version }}" \
            --build "${{ steps.plan.outputs.build }}"
          git diff project.yml

      - name: 安装 XcodeGen 并生成 Xcode 工程
        if: steps.plan.outputs.should_release == 'true'
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Release 编译 IronBowl 与 IronBowlCalendar
        if: steps.plan.outputs.should_release == 'true'
        run: |
          xcodebuild -project IronBowl.xcodeproj -scheme IronBowl -configuration Release -derivedDataPath build/DerivedData build
          xcodebuild -project IronBowl.xcodeproj -scheme Calendar -configuration Release -derivedDataPath build/DerivedData build

      - name: 校验版本并打包 DMG / ZIP 安装包与校验文件
        if: steps.plan.outputs.should_release == 'true'
        env:
          VER: ${{ steps.plan.outputs.version }}
          EXPECTED_BUILD: ${{ steps.plan.outputs.build }}
        run: |
          mkdir -p dist
          PRODUCTS_DIR="build/DerivedData/Build/Products/Release"

          for app in IronBowl.app IronBowlCalendar.app; do
            plist="$PRODUCTS_DIR/$app/Contents/Info.plist"
            res_dir="$PRODUCTS_DIR/$app/Contents/Resources"
            actual_ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
            actual_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
            display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")"
            bundle_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")"
            has_localized="$(/usr/libexec/PlistBuddy -c 'Print :LSHasLocalizedDisplayName' "$plist")"
            feed_url="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$plist")"
            pub_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist")"
            echo "$app -> version=$actual_ver build=$actual_build display=$display_name name=$bundle_name localized=$has_localized feed=$feed_url"
            [[ "$actual_ver" == "$VER" ]]
            [[ "$actual_build" == "$EXPECTED_BUILD" ]]
            [[ -n "$display_name" ]]
            [[ -n "$bundle_name" ]]
            [[ "$has_localized" == "true" ]]
            [[ -f "$res_dir/zh-Hans.lproj/InfoPlist.strings" ]]
            [[ -f "$res_dir/en.lproj/InfoPlist.strings" ]]
            [[ -n "$feed_url" ]]
            [[ -n "$pub_key" ]]
          done

          package_app() {
            local app_name="$1"
            local artifact_prefix="$2"
            local vol_name="$3"
            local app_path="$PRODUCTS_DIR/$app_name"
            local base_name="${artifact_prefix}-v${VER}-macOS-arm64"

            ditto -c -k --sequesterRsrc --keepParent "$app_path" "dist/${base_name}.zip"

            local stage_dir
            stage_dir="$(mktemp -d)"
            cp -R "$app_path" "$stage_dir/$app_name"
            ln -s /Applications "$stage_dir/Applications"
            hdiutil create \
              -volname "$vol_name" \
              -srcfolder "$stage_dir" \
              -ov -format UDZO \
              "dist/${base_name}.dmg"
            rm -rf "$stage_dir"
          }

          package_app "IronBowl.app" "IronBowl" "饭碗 v${VER}"
          package_app "IronBowlCalendar.app" "IronBowlCalendar" "万年历 v${VER}"

          (cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: 生成 Sparkle Appcast 并签名（Ed25519）
        if: steps.plan.outputs.should_release == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VER: ${{ steps.plan.outputs.version }}
          BUILD_NUM: ${{ steps.plan.outputs.build }}
          TAG: ${{ steps.plan.outputs.tag }}
          REPO: ${{ github.repository }}
          SPARKLE_VERSION: "2.10.1"
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "缺少 SPARKLE_PRIVATE_KEY Secret，请先在仓库 Settings -> Secrets and variables -> Actions 中配置。" >&2
            exit 1
          fi

          SPARKLE_TMP="$(mktemp -d)"
          trap 'rm -rf "$SPARKLE_TMP"' EXIT
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o "$SPARKLE_TMP/sparkle.tar.xz"
          tar -xJf "$SPARKLE_TMP/sparkle.tar.xz" -C "$SPARKLE_TMP" bin/sign_update

          IRONBOWL_ZIP="dist/IronBowl-v${VER}-macOS-arm64.zip"
          CALENDAR_ZIP="dist/IronBowlCalendar-v${VER}-macOS-arm64.zip"

          IRONBOWL_SIGN="$(printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_TMP/bin/sign_update" --ed-key-file - "$IRONBOWL_ZIP")"
          CALENDAR_SIGN="$(printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_TMP/bin/sign_update" --ed-key-file - "$CALENDAR_ZIP")"

          python3 scripts/release.py appcast \
            --app-name "饭碗" \
            --feed-url "https://github.com/${REPO}/releases/latest/download/appcast-ironbowl.xml" \
            --release-url "https://github.com/${REPO}/releases/tag/${TAG}" \
            --download-url "https://github.com/${REPO}/releases/download/${TAG}/IronBowl-v${VER}-macOS-arm64.zip" \
            --version "$VER" \
            --build "$BUILD_NUM" \
            --archive "$IRONBOWL_ZIP" \
            --sign-output "$IRONBOWL_SIGN" \
            --notes-file release-notes.md \
            --output dist/appcast-ironbowl.xml

          python3 scripts/release.py appcast \
            --app-name "万年历" \
            --feed-url "https://github.com/${REPO}/releases/latest/download/appcast-calendar.xml" \
            --release-url "https://github.com/${REPO}/releases/tag/${TAG}" \
            --download-url "https://github.com/${REPO}/releases/download/${TAG}/IronBowlCalendar-v${VER}-macOS-arm64.zip" \
            --version "$VER" \
            --build "$BUILD_NUM" \
            --archive "$CALENDAR_ZIP" \
            --sign-output "$CALENDAR_SIGN" \
            --notes-file release-notes.md \
            --output dist/appcast-calendar.xml

          python3 -c '
          import xml.etree.ElementTree as ET
          for p in ("dist/appcast-ironbowl.xml", "dist/appcast-calendar.xml"):
              root = ET.parse(p).getroot()
              enc = root.find("./channel/item/enclosure")
              assert enc is not None, f"missing enclosure in {p}"
              print(p, enc.attrib.get("url"), enc.attrib.get("length"))
          '

      - name: 提交版本升级记录并推送 Tag
        if: steps.plan.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): 发布 ${TAG}"
          fi
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin HEAD:main
          git push origin "$TAG"

      - name: 创建 GitHub Release 并上传产物
        if: steps.plan.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          VER: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "$TAG" \
            "dist/IronBowl-v${VER}-macOS-arm64.dmg#饭碗-v${VER}-macOS-arm64.dmg" \
            "dist/IronBowl-v${VER}-macOS-arm64.zip#饭碗-v${VER}-macOS-arm64.zip" \
            "dist/IronBowlCalendar-v${VER}-macOS-arm64.dmg#万年历-v${VER}-macOS-arm64.dmg" \
            "dist/IronBowlCalendar-v${VER}-macOS-arm64.zip#万年历-v${VER}-macOS-arm64.zip" \
            "dist/SHA256SUMS.txt" \
            "dist/appcast-ironbowl.xml" \
            "dist/appcast-calendar.xml" \
            --title "饭碗 ${TAG}" \
            --notes-file release-notes.md
