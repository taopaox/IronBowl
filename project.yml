name: IronBowl
options:
  bundleIdPrefix: com.taopaox
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
  IronBowlKit:
    path: Packages/IronBowlKit
  ZentaoLogPlugin:
    path: Packages/ZentaoLogPlugin
  CalendarPlugin:
    path: Packages/CalendarPlugin
  FeishuPlugin:
    path: Packages/FeishuPlugin
  AIWebPlugin:
    path: Packages/AIWebPlugin
  SchedulerPlugin:
    path: Packages/SchedulerPlugin
  ReportPlugin:
    path: Packages/ReportPlugin
targets:
  IronBowl:
    type: application
    platform: macOS
    sources:
      - path: Apps/IronBowl
      - path: Apps/Shared
    dependencies:
      - package: Sparkle
      - package: IronBowlKit
      - package: ZentaoLogPlugin
      - package: CalendarPlugin
      - package: FeishuPlugin
      - package: AIWebPlugin
      - package: SchedulerPlugin
      - package: ReportPlugin
    info:
      path: Apps/IronBowl/Info.plist
      properties:
        CFBundleDisplayName: 饭碗
        CFBundleName: IronBowl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSUserNotificationAlertStyle: alert
        NSHumanReadableCopyright: 饭碗 IronBowl
        SUFeedURL: https://github.com/taopaox/IronBowl/releases/latest/download/appcast-ironbowl.xml
        SUPublicEDKey: BDkyFzrp28vcg8cMVHXpuc/NpDukEfbD+WPUlAR/TmA=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taopaox.ironbowl
        PRODUCT_NAME: IronBowl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  Calendar:
    type: application
    platform: macOS
    sources:
      - path: Apps/Calendar
      - path: Apps/Shared
    dependencies:
      - package: Sparkle
      - package: IronBowlKit
      - package: CalendarPlugin
    info:
      path: Apps/Calendar/Info.plist
      properties:
        CFBundleDisplayName: 饭碗万年历
        CFBundleName: IronBowlCalendar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.lifestyle
        NSHumanReadableCopyright: 饭碗 IronBowl
        SUFeedURL: https://github.com/taopaox/IronBowl/releases/latest/download/appcast-calendar.xml
        SUPublicEDKey: BDkyFzrp28vcg8cMVHXpuc/NpDukEfbD+WPUlAR/TmA=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taopaox.ironbowl.calendar
        PRODUCT_NAME: IronBowlCalendar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
